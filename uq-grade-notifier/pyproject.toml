[project]
name = "uqgrades"
version = "0.1.0"
description = "UQ 新成绩推送：盯着 Learn.UQ 和 my.UQ 的成绩，有新成绩时通过 Bark 推送到 iPhone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.63.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
uqgrades = "uqgrades.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uqgrades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
