/* 把上面两张紧凑表展开成与 EVENTS 同结构的记录（英文名逐字照抄官网）。 */
function expandResearchQuarters(rows) {
  var out = [];
  rows.forEach(function (r) {
    var tag = 'rq-' + r.year + '-' + r.q, zh = r.year + ' 研究季度 ' + r.q, en = 'Research Quarter ' + r.q + ', ' + r.year + ' — ';
    var base = { period: 'RQ', group: tag, groupZh: zh, groupEn: 'Quarter ' + r.q + ', ' + r.year, audience: A_HDR, sourceUrl: SRC.A };
    out.push(Object.assign({ id: tag + '-start', titleZh: zh + ' 开始', titleEn: en + 'Starts', start: r.start, category: 'teaching', importance: 'normal', col: 'start' }, base));
    out.push(Object.assign({ id: tag + '-fees', titleZh: zh + ' 学费缴纳截止日', titleEn: en + 'Due date for payment of RQ' + r.q + ' fees', start: r.feeDue, category: 'fees', importance: 'high', risk: 'rqFee', col: 'feeDue' }, base));
    out.push(Object.assign({ id: tag + '-census', titleZh: zh + ' Census date：取消注册不收学费的最后一天', titleEn: en + 'Census date – Last date to cancel your enrolment without financial liability', start: r.census, category: 'withdraw', importance: 'high', risk: 'rqCensus', col: 'census' }, base));
    out.push(Object.assign({ id: tag + '-end', titleZh: zh + ' 结束', titleEn: en + 'Ends', start: r.end, category: 'teaching', importance: 'normal', col: 'end' }, base));
  });
  return out;
}
function expandTeachingPeriods(rows) {
  var out = [];
  rows.forEach(function (r) {
    var tag = 'tp-' + r.year + '-' + r.n, zh = r.year + ' 教学段 ' + r.n, en = 'Teaching Period ' + r.n + ' (' + r.linked + '), ' + r.year + ' — ';
    var base = { period: 'TP', group: tag, groupZh: zh, groupEn: 'Period ' + r.n + ' (' + r.linked + '), ' + r.year, audience: A_CW, sourceUrl: SRC.A };
    out.push(Object.assign({ id: tag + '-start', titleZh: zh + ' 选课截止并开课', titleEn: en + 'Enrolments close – last date to add courses or alter your enrolment / Classes start', start: r.start, category: 'teaching', importance: 'high', col: 'start' }, base));
    out.push(Object.assign({ id: tag + '-fees', titleZh: zh + ' 学费缴纳截止日', titleEn: en + 'Due date for payment of fees', start: r.feeDue, category: 'fees', importance: 'high', risk: 'feeDue', col: 'feeDue' }, base));
    out.push(Object.assign({ id: tag + '-census', titleZh: zh + ' Census date：退课不收学费且无学术处罚的最后一天', titleEn: en + 'Census date – Last date to drop courses or cancel enrolment without financial liability and academic penalty', start: r.census, category: 'withdraw', importance: 'high', risk: 'tpCensus', col: 'census' }, base));
    out.push(Object.assign({ id: tag + '-end', titleZh: zh + ' 课程结束', titleEn: en + 'Classes end', start: r.end, category: 'teaching', importance: 'normal', col: 'end' }, base));
  });
  return out;
}

*{box-sizing:border-box}

.up-days b{display:block;font-size:22px;line-height:1.1;font-weight:800;color:var(--c)}
.up-days span{font-size:11.5px;color:var(--muted)}
.up-t{min-width:0}
.up-t .zh{font-size:14.5px;font-weight:700;line-height:1.35}
.up-t .d{font-size:12.5px;color:var(--muted)}

/* ---------- 回国规划 ---------- */
.trip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 10px}
.trip-card{flex:none;width:84%;max-width:330px;scroll-snap-align:start;padding:14px;border-top:4px solid var(--c-break)}
@media (min-width:820px){.trip{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}.trip-card{width:auto;max-width:none}}
.trip-card h3{font-size:16px;font-weight:700}
.trip-range{font-size:14px;margin-top:2px}
.trip-days{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--c-break);background:var(--c-break-bg);border-radius:999px;padding:1px 9px}
.trip-cn{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.trip-cn span{font-size:12.5px;border-radius:6px;padding:1px 7px;background:var(--danger-bg);color:var(--danger)}
.trip-list{margin:9px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:5px}
.trip-list li{padding-left:15px;position:relative}
.trip-list li:before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.trip-list li.warn{color:var(--text)}
.trip-list li.warn:before{background:var(--danger)}
.trip-note{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- 工具栏 ---------- */
.tools{padding:12px;display:grid;gap:10px}
.tools-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 180px;position:relative;min-width:0}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 12px 0 36px;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search .ic{position:absolute;left:11px;top:11px;font-size:17px;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink);font-weight:700}
.chip.cat[aria-pressed="true"]{background:var(--cbg);border-color:var(--c);color:var(--c)}
.chip .ic{font-size:14px}
.tools-k{font-size:12.5px;color:var(--faint);width:100%}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--text);min-height:32px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.switch input:after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--brand-ink)}
.switch input:checked:after{transform:translateX(16px)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--text)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{min-height:30px;padding:2px 9px;font-size:13px;border-radius:8px}
.list-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.list-bar .sp{flex:1}
.notice{font-size:13px;border-radius:10px;padding:8px 11px;background:var(--amber-bg);color:var(--amber);margin:8px 0}
.notice button{border:0;background:none;color:inherit;text-decoration:underline;padding:0;font-size:13px}

/* ---------- 时间轴 ---------- */
.month-h{position:sticky;top:var(--header-h);z-index:5;background:var(--bg);padding:10px 2px 6px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.month-h span{font-size:12px;color:var(--faint);font-weight:400}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ev{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:11px 12px 11px 10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px}
.ev.is-high{box-shadow:var(--shadow)}
.ev.is-past{opacity:.58}
.ev.is-flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brand-ink)}100%{box-shadow:0 0 0 3px transparent}}
.ev-date{text-align:center;line-height:1.25;white-space:nowrap}
.ev-date b{display:block;font-size:14.5px;font-weight:800}
.ev-date span{display:block;font-size:12px;color:var(--muted)}
.ev-date .to{font-size:11.5px;color:var(--muted)}
.ev-main{min-width:0}
.ev-title{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-size:15.5px;font-weight:700;line-height:1.4;color:var(--text)}
.ev-en{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.ev-time{font-size:13px;margin-top:5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ev-time b{font-weight:700}
.ev-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.tagc{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;background:var(--cbg);color:var(--c);font-weight:700}
.tagc .ic{font-size:13px}
.tg{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tg.hi{background:var(--danger-bg);color:var(--danger);font-weight:700}
.tg.prov{background:var(--amber-bg);color:var(--amber);font-weight:700}
.tg.doubt{background:var(--amber-bg);color:var(--amber);font-weight:700;border:1px dashed currentColor}
.tg.soon{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.tg.now{background:var(--ok-bg);color:var(--ok);font-weight:700}
.ev-risk{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--danger);background:var(--danger-bg);border-radius:8px;padding:6px 9px;display:flex;gap:7px}
.ev-risk .ic{margin-top:.22em}
.ev-tip{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--c-break);background:var(--c-break-bg);border-radius:8px;padding:6px 9px;display:flex;gap:7px}
.ev-tip .ic{margin-top:.22em}
.ev-doubt{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:6px 9px;display:flex;gap:7px}
.ev-doubt .ic{margin-top:.22em}
.ev-body{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;display:grid;gap:7px}
.ev-body ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.ev-body .who-line{background:var(--brand-soft);color:var(--text);border-radius:8px;padding:6px 9px}
.ev-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.term{border-bottom:1px dotted currentColor;cursor:help}
.ev-chips .tg.term{border-bottom:0}
.ov{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:7px 12px 7px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13.5px;background:transparent}
.ov .ev-date b{font-size:13.5px;font-weight:700}
.ov-t{min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.ov-t .en{font-size:12px;color:var(--muted)}
.ov-tag{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5}
.ov-tag.qld{background:var(--c-enrol-bg);color:var(--c-enrol)}
.ov-tag.cn{background:var(--danger-bg);color:var(--danger)}
.today-mark{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--brand-ink);padding:2px 0}
.today-mark:before,.today-mark:after{content:"";height:2px;background:var(--brand-ink);flex:1;border-radius:2px;opacity:.55}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.tbd{margin-top:14px;padding:12px 14px}
.tbd h3{font-size:14.5px;font-weight:700;margin-bottom:6px}
.tbd ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px}
.tbd li b{font-weight:700}
.tbd .en{color:var(--muted);font-size:12.5px}
.tbd .tg{margin-right:6px}

/* ---------- 月历 ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-bar h3{font-size:17px;font-weight:700;flex:1;text-align:center}
.cal{padding:8px}
.cal-grid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{font-size:11.5px;color:var(--faint);text-align:center;padding:2px 0}
.cal-wk{font-size:10.5px;line-height:1.2;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;background:var(--surface-2);padding:2px 1px}
.cal-d{position:relative;min-height:58px;border:1px solid transparent;border-radius:8px;background:var(--surface-2);padding:3px 3px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-d.out{opacity:.38}
.cal-d.ph-break{background:var(--ph-break)}
.cal-d.ph-vac{background:var(--ph-vac)}
.cal-d.ph-revision{background:var(--ph-revision)}
.cal-d.ph-exam{background:var(--ph-exam)}
.cal-d.today{border-color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--brand-ink)}
.cal-d.sel{outline:2px solid var(--brand-ink);outline-offset:1px}
.cal-n{font-size:13px;font-weight:700;line-height:1.2;display:flex;justify-content:space-between;align-items:flex-start;gap:2px}
.cal-n em{font-style:normal;font-size:9.5px;font-weight:700;line-height:1.25;border-radius:3px;padding:0 2px}
.cal-n em.q{background:var(--c-enrol-bg);color:var(--c-enrol)}
.cal-n em.c{background:var(--danger-bg);color:var(--danger)}
.cal-n em.w{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.cal-p{display:flex;flex-wrap:wrap;gap:2px}
.pill{font-size:10.5px;line-height:1.35;font-weight:700;border-radius:4px;padding:0 3px;background:var(--cbg);color:var(--c);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill.hi{box-shadow:inset 0 0 0 1px var(--c)}
.pill .lg{display:none}
@media (min-width:700px){.cal-d{min-height:86px}.pill{display:block;width:100%}.pill .lg{display:inline}.pill .sh{display:none}.cal-grid{grid-template-columns:52px repeat(7,minmax(0,1fr))}.cal-wk{font-size:12px}}
.cal-legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;padding:0 2px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.day-panel{margin-top:10px}
.day-panel h3{font-size:15px;font-weight:700;margin-bottom:8px}

/* ---------- 次要内容、术语、说明 ---------- */
details.fold{margin-top:10px}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .en{font-size:12.5px;font-weight:400;color:var(--faint)}
details.fold>summary .ic{margin-left:auto;transition:transform .15s;color:var(--faint)}
details.fold[open]>summary .ic{transform:rotate(180deg)}
.fold-body{padding:0 14px 14px;font-size:13.5px}
.grp-list{display:grid;gap:8px}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grp.cur{background:var(--brand-soft);border-color:var(--brand-ink)}
.grp.old{opacity:.6}
.grp-h{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.grp-h .sp{flex:1}
.grp-g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:9px}
@media (min-width:700px){.grp-g{grid-template-columns:repeat(4,1fr)}}
.grp-c .k{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.grp-c .k small{display:block;font-size:11px;color:var(--faint)}
.grp-c b{font-size:15px}
.gloss{display:grid;gap:8px}
@media (min-width:720px){.gloss{grid-template-columns:1fr 1fr}}
.gl{padding:11px 13px}
.gl h3{font-size:15px;font-weight:700}
.gl h3 span{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.gl p{font-size:13.5px;color:var(--muted);margin-top:3px}
.help{padding:14px;font-size:14px;display:grid;gap:10px}
.help ol,.help ul{margin:0;padding-left:1.3em;display:grid;gap:4px}
.help h3{font-size:15px}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:0 8px}
.exp-list{display:flex;gap:6px;flex-wrap:wrap}

.tip{position:absolute;z-index:60;max-width:300px;background:#221a2f;color:#fff;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tip b{display:block;font-size:13.5px;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;max-width:min(92vw,460px);background:#221a2f;color:#fff;border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.35)}

footer{margin-top:28px;padding:18px 16px 34px;border-top:1px solid var(--line);background:var(--surface)}
.foot-in{max-width:960px;margin:0 auto;font-size:13px;color:var(--muted);display:grid;gap:10px}
.foot-in strong{color:var(--text)}
.foot-in ul{margin:0;padding-left:1.2em;display:grid;gap:3px}

/* ---------- 打印：一个学期一页 A4 ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:9mm 10mm}
  html,body{background:#fff !important;color:#000 !important}
  body>*:not(#print){display:none !important}
  #print{display:block;font:8pt/1.32 var(--font);color:#000}
  .pp{break-after:page;page-break-after:always}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp-h{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:1.2pt solid #000;padding-bottom:1.5mm;margin-bottom:2mm}
  .pp-h h1{font-size:14pt;line-height:1.2;font-weight:800}
  .pp-h h1 span{font-size:9pt;font-weight:400;margin-left:2mm}
  .pp-h p{font-size:7pt;text-align:right;line-height:1.35}
  .pp-list{list-style:none;margin:0;padding:0;columns:2;column-gap:7mm}
  .pp-list li{break-inside:avoid;page-break-inside:avoid;display:grid;grid-template-columns:19mm 1fr;gap:1.5mm;padding:.75mm 0;border-bottom:.3pt solid #bbb}
  .pp-d{font-weight:700;font-variant-numeric:tabular-nums}
  .pp-d small{display:block;font-weight:400;font-size:6.5pt}
  .pp-t b{font-weight:700}
  .pp-t .star{font-weight:800}
  .pp-t .en{display:block;font-size:6.3pt;line-height:1.25;color:#333}
  .pp-t .mk{font-size:6.5pt;border:.4pt solid #000;border-radius:1.5pt;padding:0 .8mm;margin-left:1mm;white-space:nowrap}
  .pp-f{margin-top:2mm;padding-top:1.2mm;border-top:.6pt solid #000;font-size:6.6pt;line-height:1.35;color:#000}
  .pp-f p+p{margin-top:.6mm}
}
</style>
</head>

<header class="top">
  <div class="top-in">
    <span class="brand">UQ 中文校历</span>

  </div>
</header>

<main class="wrap" id="top">
  <nav class="nav" aria-label="页面导航">

  <section class="hero" id="hero" aria-live="polite"></section>

  <section id="sec-up">
    <div class="sec-h"><h2>接下来的重要日期</h2><span class="en">按布里斯班日期倒数</span></div>
    <div class="up" id="up"></div>
  </section>

  <section id="sec-trip">
    <div class="sec-h"><h2>假期与回国规划</h2><span class="en">根据官方开课、考试日期计算</span></div>
    <div id="trip-wrap"></div>
  </section>

  <section id="sec-cal">
    <div class="sec-h">

<script>
/* =====================================================================
 * 应用区：下面是页面逻辑，每年更新数据时一般不需要改动。

(function () {
'use strict';

/* ---------- 日期工具（全部用「距 1970-01-01 的天数」计算，避开设备时区） ---------- */
var DAY = 86400000;
var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dn(s) { var p = s.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY); }
function parts(n) { var d = new Date(n * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay() }; }
function ds(n) { var p = parts(n); return p.y + '-' + pad(p.m) + '-' + pad(p.d); }
function monday(n) { return n - ((parts(n).w + 6) % 7); }
function md(n) { var p = parts(n); return p.m + '月' + p.d + '日'; }
function mdw(n) { return md(n) + ' ' + WD[parts(n).w]; }
function ymd(n) { var p = parts(n); return p.y + '年' + p.m + '月' + p.d + '日'; }
function ymdw(n) { return ymd(n) + ' ' + WD[parts(n).w]; }
function rangeText(s, e) {
  if (s === e) return md(s);
  var a = parts(s), b = parts(e);
  if (a.y !== b.y) return ymd(s) + '–' + ymd(e);
  if (a.m === b.m) return a.m + '月' + a.d + '–' + b.d + '日';
  return md(s) + '–' + md(e);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function $(id) { return document.getElementById(id); }
function ic(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }

/* ---------- 「今天」按布里斯班时间（UTC+10，无夏令时）计算 ---------- */
var TEST_TODAY = null;
(function () { var m = /[?&]today=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); if (m) TEST_TODAY = m[1]; })();
function brisbaneNow() {
  var t = Date.now() + 10 * 3600000, d = new Date(t);
  return { day: TEST_TODAY ? dn(TEST_TODAY) : Math.floor(t / DAY), hm: pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) };
}
function beijingNow() {
  var t = Date.now() + 8 * 3600000, d = new Date(t);
  return { day: Math.floor(t / DAY), hm: pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) };
}
function toBeijing(hm) {            // 布里斯班 HH:MM → 北京时间（早 2 小时）
  var p = hm.split(':'), m = (+p[0]) * 60 + (+p[1]) - 120, pre = '';

}
var TODAY = brisbaneNow().day;

/* ---------- 状态与本地存储（读写都包 try/catch） ---------- */
var STORE_KEY = 'uq-zh-calendar.v1';
var state = {
  res: 'intl', level: 'ug', summer: false,          // 身份：默认国际生 · 本科 · 不上暑期课
  view: 'list', period: 'all', cats: {}, important: false, q: '', showPast: false,
  cn: true, qld: true, theme: 'auto', remind: 3, remindEvent: false,
  month: null, selDay: null
};
var ALLOWED = {
  res: ['intl', 'dom'], level: ['ug', 'pgcw', 'hdr'], summer: [true, false], view: ['list', 'month'],
  cn: [true, false], qld: [true, false], theme: ['auto', 'light', 'dark'], remind: [0, 1, 3, 7], remindEvent: [true, false]
};
function loadState() {
  try {
    var raw = window.localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return;
    Object.keys(ALLOWED).forEach(function (k) { if (ALLOWED[k].indexOf(o[k]) >= 0) state[k] = o[k]; });
  } catch (e) { /* 读不到就用默认值 */ }
}
function saveState() {
  try {
    var o = {};
    Object.keys(ALLOWED).forEach(function (k) { o[k] = state[k]; });
    window.localStorage.setItem(STORE_KEY, JSON.stringify(o));
  } catch (e) { /* 无痕模式或被禁用时忽略 */ }
}

/* ---------- 类别 ---------- */
var CATS = {
  enrol:    { zh: '选课', sh: '选' },
  fees:     { zh: '缴费', sh: '缴' },
  withdraw: { zh: '退课', sh: '退' },
  teaching: { zh: '上课', sh: '课' },
  exam:     { zh: '考试', sh: '考' },
  grades:   { zh: '成绩', sh: '绩' },
  'break':  { zh: '假期', sh: '假' },
  event:    { zh: '活动', sh: '活' }
};
var CAT_ORDER = ['enrol', 'fees', 'withdraw', 'teaching', 'exam', 'grades', 'break', 'event'];
function cvar(c) { return 'style="--c:var(--c-' + c + ');--cbg:var(--c-' + c + '-bg)"'; }
function anyCat() { for (var k in state.cats) { if (state.cats[k]) return true; } return false; }

/* ---------- 高风险截止日：大白话后果（依据 my.UQ 的退课、缴费、迟注册页面） ---------- */
var RISKS = {
  enrolDue: {

    src: SRC.L },
  addDue: {
    short: '这天之后不能自己加课或换课；再想加课要申请审批，并收 $50。',

    pgcw: '授课型硕士在入学的第一个学期免收这 $50。',
    src: SRC.L },
  feeDue: {

    intl: '国际生：退课或减少学分可能影响学生签证，退课前先咨询学院（faculty）。入学第一个学期如果在 Census date 前退学（withdraw from program），会收一笔取消注册的行政费。',
    src: SRC.W },
  noPenalty: {

    detail: ['当天或之前退课：学费照付，但只在 studies report 上记 W，不会出现在正式成绩单（transcript）上。', '过了这天再退课：学费照付，成绩单上记 K（带学术处罚的退课），算 GPA 时按 0 分计。'],
    intl: '国际生：退课前先咨询学院，确认不会影响学生签证要求的学习量。',
    src: SRC.W },
  lastWithdraw: {

    detail: ['这是还能在 mySI-net 退课的最后一天。此时退课记 K（GPA 按 0 分计），学费照付。', '考试周开始后不能再退课，学校会按你已完成的考核给出成绩。'],
    src: SRC.W },
  rqFee: {
    short: '逾期未付清罚 $100；到 Census date 还没付清，注册可能被取消。',
    detail: ['研究型学位按研究季度缴费，金额在 mySI-net 的 Financial 页面查看。'],
    src: SRC.A },
  rqCensus: {
    short: '过了这天再取消注册，本季度学费照付。',
    detail: ['研究型学位（HDR）退学没有学术处罚。', '这里的 financial liability 只指学费，不需要退还奖学金。'],
    src: SRC.W },
  tpCensus: {
    short: '过了这天再退课，学费照付，而且有学术处罚。',
    detail: ['教学段的 Census date 同时也是无学术处罚退课的最后一天，两个日期合在一起。', '这类课程通常没有期末考试周，最晚可以退到课程的最后一天，但那时学费照付、成绩单记 K。'],
    src: SRC.W }
};

/* ---------- 术语自动加注 ---------- */
var GMAP = {}, TERM_MAP = {}, TERM_LIST = [];
GLOSSARY.forEach(function (g) {
  GMAP[g.id] = g;
  g.terms.forEach(function (t) { TERM_MAP[t.toLowerCase()] = g.id; TERM_LIST.push(t); });
});
TERM_LIST.sort(function (a, b) { return b.length - a.length; });
var TERM_RE = new RegExp('(' + TERM_LIST.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
function gloss(text) {
  return esc(text).replace(TERM_RE, function (m) {
    var id = TERM_MAP[m.toLowerCase()];
    return id ? '<span class="term" role="button" tabindex="0" data-term="' + id + '">' + m + '</span>' : m;
  });
}

/* ---------- 学期阶段与教学周 ---------- */
var PMAP = {};
PERIODS.forEach(function (p) { PMAP[p.id] = p; });
var TEACH = PERIODS.filter(function (p) { return p.type === 'semester' || p.type === 'summer'; });
var EMAP = {};
EVENTS.forEach(function (ev) {
  EMAP[ev.id] = ev;
  var p = PMAP[ev.period];
  ev._hay = [ev.titleZh, ev.titleEn, ev.note || '', ev.tip || '', ev.keywords || '', CATS[ev.category].zh,
    p ? p.nameZh + ' ' + p.nameEn + ' ' + p.short : '', ev.risk ? RISKS[ev.risk].short : '',
    ev.provisional ? '暂定 provisional' : ''].join(' ').toLowerCase();
});
function activeTeach() { return TEACH.filter(function (p) { return p.type === 'semester' || state.summer; }); }

/* 完全落在期中假期里的周一（这些周不计入教学周） */
function breakMondays(p) {
  var out = [], stop = monday(dn(p.classesResume));
  for (var m = monday(dn(p.lastClassBeforeBreak)) + 7; m < stop; m += 7) out.push(m);
  return out;
}
function teachingWeek(p, d) {
  var first = monday(dn(p.classesStart)), m = monday(d), skip = 0;
  breakMondays(p).forEach(function (b) { if (b <= m) skip++; });
  return (m - first) / 7 + 1 - skip;
}
function totalWeeks(p) { return teachingWeek(p, dn(p.classesEnd)); }
function inBreak(p, d) {
  return d > dn(p.lastClassBeforeBreak) && d < monday(dn(p.classesResume)) && (!p.breakStart || d >= dn(p.breakStart));
}
function phaseIn(p, d) {
  if (d < dn(p.classesStart) || d > dn(p.end)) return null;
  if (d < dn(p.revision[0])) {
    if (inBreak(p, d)) return { phase: 'break', p: p };
    return { phase: 'teach', p: p, week: teachingWeek(p, d) };
  }
  if (d <= dn(p.revision[1])) return { phase: 'revision', p: p };
  return { phase: 'exam', p: p };
}
/* 给定日期处于什么阶段。all=true 时不管「是否上暑期课」的设置 */
function phaseInfo(d, all) {
  var list = all ? TEACH : activeTeach(), i, r, prev = null, next = null;
  for (i = 0; i < list.length; i++) { r = phaseIn(list[i], d); if (r) return r; }
  list.forEach(function (p) {
    if (dn(p.end) < d && (!prev || dn(p.end) > dn(prev.end))) prev = p;
    if (dn(p.classesStart) > d && (!next || dn(p.classesStart) < dn(next.classesStart))) next = p;
  });
  if (next && next.orientation && d >= dn(next.orientation[0]) && d <= dn(next.orientation[1])) return { phase: 'oweek', prev: prev, next: next };
  return { phase: 'vac', prev: prev, next: next };
}
function phaseLabel(r) {
  if (r.phase === 'teach') return '第 ' + r.week + ' 教学周';
  if (r.phase === 'break') return '期中假期';
  if (r.phase === 'revision') return '复习周';
  if (r.phase === 'exam') return '期末考试周';
  if (r.phase === 'oweek') return '迎新周';
  return r.prev ? r.prev.breakAfterZh : '假期';
}
function rqAt(d) {
  for (var i = 0; i < RESEARCH_QUARTERS.length; i++) {
    var r = RESEARCH_QUARTERS[i];
    if (d >= dn(r.start) && d <= dn(r.end)) return r;
  }
  return null;
}

/* ---------- 事件可见性 ---------- */
function audOK(ev) { return ev.audience.indexOf(state.res) >= 0 && ev.audience.indexOf(state.level) >= 0; }
function isSummer(pid) { return !!PMAP[pid] && PMAP[pid].type === 'summer'; }
function inMain(ev) {
  if (ev.period === 'TP') return false;
  if (!audOK(ev)) return false;
  if (isSummer(ev.period) && !state.summer && state.period !== ev.period) return false;
  return true;
}
function passFilters(ev) {
  if (state.period !== 'all' && ev.period !== state.period) return false;
  if (state.important && ev.importance !== 'high') return false;
  if (anyCat() && !state.cats[ev.category]) return false;
  if (state.q && ev._hay.indexOf(state.q) < 0) return false;
  return true;
}
function evS(ev) { return dn(ev.start); }
function evE(ev) { return dn(ev.end || ev.start); }
function rank(ev) { return ev.importance === 'high' ? 0 : ev.importance === 'normal' ? 1 : 2; }
function byDate(a, b) { return evS(a) - evS(b) || rank(a) - rank(b) || (a.time || '').localeCompare(b.time || ''); }
function countdown(s, e) {
  if (s > TODAY) return s - TODAY === 1 ? '明天' : '还有 ' + (s - TODAY) + ' 天';
  if (e > TODAY) return '进行中 · 还剩 ' + (e - TODAY) + ' 天';
  if (e === TODAY) return s === e ? '今天' : '今天结束';
  return '已过';
}

/* ---------- 首页状态卡 ---------- */
function nextDeadline() {
  var best = null;
  EVENTS.forEach(function (ev) {
    if (ev.tbd || !ev.risk || !inMain(ev) || evS(ev) < TODAY) return;
    if (!best || byDate(ev, best) < 0) best = ev;
  });
  return best;
}
function weeksBar(p, r) {
  var T = totalWeeks(p), brkAfter = teachingWeek(p, dn(p.lastClassBeforeBreak)), h = '<div class="weeks" aria-hidden="true">';
  var cur = r.phase === 'teach' ? r.week : (r.phase === 'break' ? brkAfter + 0.5 : T + 1);
  for (var i = 1; i <= T; i++) {
    h += '<i class="' + (i < cur ? 'done' : i === cur ? 'now' : '') + '"></i>';
    if (i === brkAfter) h += '<i class="brk ' + (cur === brkAfter + 0.5 ? 'now' : cur > brkAfter ? 'done' : '') + '" title="期中假期"></i>';
  }
  return h + '<span>共 ' + T + ' 个教学周，圆点是期中假期</span></div>';
}
function renderHero() {
  var now = brisbaneNow(), bj = beijingNow(), d = TODAY;
  var eyebrow = '', title = '', unit = '', en = '', sub = '', bar = '', alt = '';

  if (state.level === 'hdr') {
    var q = rqAt(d);
    eyebrow = '研究型学位 · HDR';
    if (q) {
      title = q.year + ' 研究季度 ' + q.q; en = 'Research Quarter ' + q.q + ', ' + q.year;
      sub = rangeText(dn(q.start), dn(q.end)) + ' · 本季度' + (dn(q.end) === d ? '今天结束' : '还剩 <b>' + (dn(q.end) - d) + '</b> 天');
    } else { title = '研究季度待公布'; en = 'Research quarters'; sub = '这一天的研究季度日期官网还没公布。'; }
  } else {
    var r = phaseInfo(d), p = r.p;
    if (p) eyebrow = esc(p.nameZh) + ' · <span lang="en">' + esc(p.nameEn) + '</span>';
    if (r.phase === 'teach') {
      var T = totalWeeks(p), mon = monday(d);
      title = '第 ' + r.week + ' 教学周'; unit = '共 ' + T + ' 周'; en = 'Teaching Week ' + r.week + ' of ' + T;
      if (d < dn(p.classesResume) && d > dn(p.lastClassBeforeBreak) && d >= monday(dn(p.classesResume))) sub = '今天是公假，' + mdw(dn(p.classesResume)) + ' 复课。';
      else if (r.week === T) sub = '最后一个教学周：' + md(dn(p.classesEnd)) + ' 停课，' + md(dn(p.revision[0])) + ' 起是复习周。';
      else if (mon === monday(dn(p.lastClassBeforeBreak))) sub = '本周 ' + rangeText(mon, mon + 6) + '。' + md(dn(p.lastClassBeforeBreak)) + ' 是假期前最后一天上课，' + mdw(dn(p.classesResume)) + ' 复课。';
      else sub = '本周 ' + rangeText(mon, mon + 6) + '。';
      bar = weeksBar(p, r);
    } else if (r.phase === 'break') {
      title = '期中假期'; en = 'In-semester break';
      sub = '假期不计入教学周。<b>' + mdw(dn(p.classesResume)) + '</b> 复课，进入第 ' + teachingWeek(p, dn(p.classesResume)) + ' 教学周。';
      bar = weeksBar(p, r);
    } else if (r.phase === 'revision') {
      title = '复习周'; en = 'Revision period';
      sub = '不上课。' + md(dn(p.exams[0])) + ' 开始考试，考试周 ' + rangeText(dn(p.exams[0]), dn(p.exams[1])) + '。';
    } else if (r.phase === 'exam') {
      title = '期末考试周'; en = 'Examination period';
      sub = rangeText(dn(p.exams[0]), dn(p.exams[1])) + ' · ' + (dn(p.exams[1]) === d ? '今天是最后一天' : '还剩 <b>' + (dn(p.exams[1]) - d) + '</b> 天') + '。个人考试安排以 my.UQ 公布的为准。';
    } else {

    if (code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length) { ch += line.charAt(i + 1); cp = (code - 0xD800) * 0x400 + (line.charCodeAt(i + 1) - 0xDC00) + 0x10000; i++; }
    var b = utf8len(cp), limit = out.length ? 74 : 75;
    if (bytes + b > limit) { out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
function icsUtc(ms) { var d = new Date(ms); return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z'; }
function icsDate(n) { var p = parts(n); return '' + p.y + pad(p.m) + pad(p.d); }
function brisToUtc(dateStr, hm) { var p = dateStr.split('-'), t = hm.split(':'); return Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]) - 10 * 3600000; }
function icsDescription(ev) {
  var L = [ev.titleEn], risk = ev.risk ? RISKS[ev.risk] : null;
  L.push(ev.time ? '时间：' + ev.time + (ev.timeEnd ? '–' + ev.timeEnd : '') + ' 布里斯班时间（北京时间 ' + toBeijing(ev.time) + (ev.timeEnd ? '–' + toBeijing(ev.timeEnd) : '') + '）'
                 : '日期按布里斯班时间（AEST，UTC+10）。');
  if (ev.provisional) L.push('官网标注 Provisional（暂定），日期可能调整。');
  if (risk) {
    L.push('错过的后果：' + risk.short);
    risk.detail.forEach(function (t) { L.push('· ' + t); });
    if (state.res === 'intl' && risk.intl) L.push('· ' + risk.intl);
    if (state.res === 'dom' && risk.dom) L.push('· ' + risk.dom);
    if (state.level === 'pgcw' && risk.pgcw) L.push('· ' + risk.pgcw);
  }
  if (ev.tip) L.push(ev.tip);
  if (ev.note) L.push(ev.note);
  if (ev.doubt) L.push('存疑：' + ev.doubt);
  L.push('官方来源：' + ev.sourceUrl);
  L.push('本条来自非官方的中文整理，一切以 UQ 官网为准。数据核对日期 ' + META.checkedOn + '。');
  return L.join('\n');
}
function vevent(ev, stamp, opts) {
  var L = ['BEGIN:VEVENT', 'UID:' + ev.id + ICS_DOMAIN, 'DTSTAMP:' + stamp], s = evS(ev), e = evE(ev);
  if (ev.time) {
    var st = brisToUtc(ev.start, ev.time);
    var en = ev.timeEnd ? brisToUtc(ev.start, ev.timeEnd) : st + (ev.time === '23:59' ? 60000 : 30 * 60000);
    L.push('DTSTART:' + icsUtc(st), 'DTEND:' + icsUtc(en));
  } else {
    L.push('DTSTART;VALUE=DATE:' + icsDate(s), 'DTEND;VALUE=DATE:' + icsDate(e + 1), 'TRANSP:TRANSPARENT');
  }
  L.push('SUMMARY:' + icsText((ev.provisional ? '[暂定] ' : '') + (ev.doubt ? '[存疑] ' : '') + 'UQ ' + ev.titleZh));
  L.push('DESCRIPTION:' + icsText(icsDescription(ev)));
  L.push('URL:' + ev.sourceUrl);
  L.push('CATEGORIES:' + icsText('UQ ' + CATS[ev.category].zh));
  L.push('STATUS:' + (ev.provisional ? 'TENTATIVE' : 'CONFIRMED'));
  var out = L, N = opts.remind;
  if (ev.risk && N > 0) {
    out.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText('还有 ' + N + ' 天：' + ev.titleZh),
      'TRIGGER:' + (ev.time ? '-P' + N + 'D' : (N === 1 ? '-PT15H' : '-P' + (N - 1) + 'DT15H')), 'END:VALARM');
  }
  out.push('END:VEVENT');
  if (ev.risk && N > 0 && opts.remindEvent) {
    out.push('BEGIN:VEVENT', 'UID:' + ev.id + '-remind' + ICS_DOMAIN, 'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + icsDate(s - N), 'DTEND;VALUE=DATE:' + icsDate(s - N + 1), 'TRANSP:TRANSPARENT',
      'SUMMARY:' + icsText('【提醒】' + N + ' 天后截止：UQ ' + ev.titleZh),
      'DESCRIPTION:' + icsText('截止日：' + ymdw(s) + '（布里斯班日期）\n' + RISKS[ev.risk].short + '\n官方来源：' + ev.sourceUrl),
      'STATUS:CONFIRMED', 'END:VEVENT');
  }
  return out;
}
function buildICS(events, calName, opts) {
  opts = opts || { remind: state.remind, remindEvent: state.remindEvent };
  var stamp = icsUtc(Date.now());
  var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UQ Chinese Calendar (unofficial)//ZH', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsText(calName)];
  events.forEach(function (ev) { if (!ev.tbd) L = L.concat(vevent(ev, stamp, opts)); });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}
function download(filename, text) {
  if (/MicroMessenger/i.test(navigator.userAgent || '')) { toast('微信内置浏览器不能保存日历文件。请点右上角「···」选择「在浏览器打开」后再试。'); return; }
  try {
    var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
    if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, filename); return; }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
    toast('已生成 ' + filename + '。iPhone：打开下载的文件，选「添加全部」；Google 日历：设置 → 导入。');
  } catch (e) { toast('这个浏览器不支持直接下载文件，请换用 Safari、Chrome 或 Edge 打开本页。'); }
}
function exportEvents(events, name, file) {
  events = events.filter(function (ev) { return !ev.tbd; });
  if (!events.length) { toast('没有可导出的日期。'); return; }
  download(file, buildICS(events, name));
}

/* ---------- 提示气泡与轻提示 ---------- */
var tipEl, toastEl, toastTimer, tipFor = null, tipPinned = false;
function showTip(el, pinned) {
  var g = GMAP[el.getAttribute('data-term')];
  if (!g) return;
  tipPinned = !!pinned;
  tipEl.innerHTML = '<b>' + esc(g.zh) + ' · <span lang="en">' + esc(g.en) + '</span></b>' + esc(g.desc);
  tipEl.hidden = false; tipFor = el;
  var r = el.getBoundingClientRect(), w = tipEl.offsetWidth, vw = document.documentElement.clientWidth;
  var left = Math.max(8, Math.min(r.left, vw - w - 8)) + window.pageXOffset;
  tipEl.style.left = left + 'px';
  tipEl.style.top = (r.bottom + window.pageYOffset + 6) + 'px';
}
function hideTip() { if (tipEl) { tipEl.hidden = true; tipFor = null; tipPinned = false; } }
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.hidden = true; }, 6500);
}

/* ---------- 渲染与事件 ---------- */
function applyTheme() {
  var root = document.documentElement;
  if (state.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
  $('theme-lbl').textContent = state.theme === 'auto' ? '跟随系统' : state.theme === 'light' ? '浅色' : '深色';
}
function renderCal() { renderChips(); if (state.view === 'list') renderList(); else renderMonth(); renderTbd(); renderPrint(); }
function renderAll() { renderHero(); renderWho(); renderUp(); renderTrip(); renderCal(); renderMore(); renderIcsHelp(); }

function jumpTo(id) {
  var ev = EMAP[id];
  if (!ev) return;
  state.view = 'list';
  if (!inMain(ev) || !passFilters(ev)) { state.period = 'all'; state.cats = {}; state.q = ''; state.important = false; $('q').value = ''; }
  if (evE(ev) < TODAY) state.showPast = true;
  openIds[id] = true;
  saveState(); renderCal();
  var el = $('ev-' + id);
  if (el) {
    el.scrollIntoView({ block: 'center' });
    el.classList.add('is-flash');
    setTimeout(function () { el.classList.remove('is-flash'); }, 1700);
  }
}

function onClick(e) {
  var t = e.target, term = t.closest ? t.closest('.term') : null;
  if (term) { if (tipFor === term && tipPinned) hideTip(); else showTip(term, true); e.stopPropagation(); return; }
  hideTip();
  var el = t.closest ? t.closest('[data-act],[data-view]') : null;
  if (!el) return;
  if (el.hasAttribute('data-view')) { state.view = el.getAttribute('data-view'); saveState(); renderCal(); return; }
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
  if (act === 'set') {
    var k = el.getAttribute('data-k');
    state[k] = k === 'summer' ? v === 'true' : v;
    if (k === 'level' && state.period === 'RQ' && v !== 'hdr') state.period = 'all';
    saveState(); renderAll();
  } else if (act === 'summer-on') { state.summer = true; saveState(); renderAll(); }
  else if (act === 'period') { state.period = v; renderCal(); }
  else if (act === 'cat') { state.cats[v] = !state.cats[v]; renderCal(); }
  else if (act === 'past') { state.showPast = !state.showPast; renderCal(); }
  else if (act === 'toggle') {
    openIds[id] = !openIds[id];
    var li = $('ev-' + id);
    if (li) {
      li.querySelector('.ev-body').hidden = !openIds[id];
      li.querySelector('.ev-title').setAttribute('aria-expanded', String(!!openIds[id]));
      li.querySelector('.ev-actions [data-act="toggle"]').textContent = openIds[id] ? '收起' : '详情与来源';
    }
  }
  else if (act === 'jump') { if (id) jumpTo(id); }
  else if (act === 'month') { state.month = clampMonth(addMonth(state.month, +v)); state.selDay = null; renderMonth(); }
  else if (act === 'month-today') { state.month = clampMonth(ds(TODAY).slice(0, 7)); state.selDay = TODAY; renderMonth(); }
  else if (act === 'day') { state.selDay = +v; renderMonth(); }
  else if (act === 'ics') { var ev = EMAP[id]; exportEvents([ev], 'UQ 中文校历（非官方）', 'uq-' + ev.id + '.ics'); }
  else if (act === 'ics-group') { exportEvents(EVENTS.filter(function (x) { return x.group === v; }), 'UQ 中文校历（非官方）', 'uq-' + v + '.ics'); }
  else if (act === 'ics-period') {
    exportEvents(EVENTS.filter(function (x) { return x.period === v && !x.tbd && audOK(x); }).sort(byDate), 'UQ ' + PMAP[v].nameZh + '（非官方）', 'uq-' + v.toLowerCase() + '.ics');
  }
  else if (act === 'ics-list') {
    exportEvents(listItems().filter(function (it) { return it.t === 'ev' && (state.showPast || it.e >= TODAY); }).map(function (it) { return it.ev; }), 'UQ 中文校历（非官方）', 'uq-calendar-selected.ics');
  }
}

function init() {
  loadState();
  tipEl = $('tip'); toastEl = $('toast');
  applyTheme();
  renderGloss(); renderFoot(); renderAll();

  document.addEventListener('click', onClick);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideTip(); return; }
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('term')) {
      e.preventDefault();
      if (tipFor === t && tipPinned) hideTip(); else showTip(t, true);
    }
  });
  window.addEventListener('resize', hideTip);
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    document.addEventListener('mouseover', function (e) { var t = e.target.closest ? e.target.closest('.term') : null; if (t && !tipPinned) showTip(t, false); });
    document.addEventListener('mouseout', function (e) { var t = e.target.closest ? e.target.closest('.term') : null; if (t && !tipPinned) hideTip(); });
  }
  var qTimer;
  $('q').addEventListener('input', function () {
    var val = this.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = val.trim().toLowerCase(); renderCal(); }, 120);
  });
  $('sw-important').addEventListener('change', function () { state.important = this.checked; renderCal(); });
  $('sw-cn').addEventListener('change', function () { state.cn = this.checked; saveState(); renderTrip(); renderCal(); });
  $('sw-qld').addEventListener('change', function () { state.qld = this.checked; saveState(); renderCal(); });
  $('btn-theme').addEventListener('click', function () {
    state.theme = state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto';
    saveState(); applyTheme();
  });
  $('btn-print').addEventListener('click', function () { renderPrint(); window.print(); });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sel-remind') { state.remind = +e.target.value; saveState(); }
    if (e.target.id === 'sw-remind-ev') { state.remindEvent = e.target.checked; saveState(); }
  });
  /* 布里斯班过了午夜就整页重算；其余时候只更新时钟 */
  setInterval(function () {
    var d = brisbaneNow().day;
    if (d !== TODAY) { TODAY = d; renderAll(); } else renderHero();
  }, 30000);
}

/* 供自查和调试使用 */
window.UQZH = {
  state: state, EVENTS: EVENTS, PERIODS: PERIODS, phaseInfo: phaseInfo, phaseIn: phaseIn, teachingWeek: teachingWeek, totalWeeks: totalWeeks,
  buildICS: buildICS, dn: dn, ds: ds, renderAll: renderAll, toBeijing: toBeijing, today: function () { return ds(TODAY); }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
