<!-- IP 检测：一个地球（经纬线），右下角压着一枚定位针。给起始页（callaum.com）用：白色图形，底是透明的，主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <circle cx="54" cy="54" r="31" stroke-width="6.5"/>
    <ellipse cx="54" cy="54" rx="13" ry="31" stroke-width="5" stroke-opacity=".9"/>
    <path d="M24 54h60M29 39h50M29 69h50" stroke-width="5" stroke-opacity=".9"/>
  </g>
  <path d="M84 100s-17-15.5-17-28a17 17 0 0 1 34 0c0 12.5-17 28-17 28z" fill="#fff" stroke="#0f172a" stroke-opacity=".6" stroke-width="4.6" stroke-linejoin="round"/>
  <circle cx="84" cy="72" r="6" fill="#0f172a" fill-opacity=".6"/>
</svg>
