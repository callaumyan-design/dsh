name: 9eSIM Web Manager CI

on:
  push:
    paths:
      - 'esim-manager/**'
      - '.github/workflows/esim-manager-ci.yml'
  pull_request:
    paths:
      - 'esim-manager/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esim-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esim-manager/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
