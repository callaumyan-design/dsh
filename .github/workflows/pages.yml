name: 部署网站

# 一个仓库只有一个 GitHub Pages 站点，所以四象限和热榜周刊在这里一起构建：
#   /          四象限任务计划
#   /weekly/   GitHub 热榜周刊
on:
  push:
    branches: [main]
    paths:
      - 'quadrant/**'
      - 'weekly/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            quadrant/package-lock.json
            weekly/package-lock.json

      - name: 四象限：测试并构建
        working-directory: quadrant
        run: |
          npm ci
          npm test
          npm run build

      - name: 热榜周刊：测试
        working-directory: weekly
        run: |
          npm ci
          npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: 合并站点
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/weekly/
        run: |
          mkdir -p _site
          cp -r quadrant/dist/. _site/
          node weekly/scripts/build-site.mjs --out _site/weekly

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
