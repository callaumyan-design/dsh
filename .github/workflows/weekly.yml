name: GitHub 热榜周刊

# 代码改动或新一期出刊后（出刊工作流会手动触发它），测试、生成网站并发布到 /weekly/。
on:
  push:
    branches: [main]
    paths:
      - 'weekly/**'
      - '.github/workflows/weekly.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: weekly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weekly/package-lock.json
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/weekly/
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-site
          path: weekly/dist

  publish:
    needs: build
    uses: ./.github/workflows/publish-pages.yml
    with:
      project: weekly
      artifact: weekly-site
