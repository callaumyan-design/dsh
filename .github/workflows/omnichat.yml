name: OmniChat

on:
  push:
    branches: [main]
    paths: ['omnichat/**', '.github/workflows/omnichat.yml']
  pull_request:
    paths: ['omnichat/**', '.github/workflows/omnichat.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnichat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnichat/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: End-to-end test against mock providers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/mock-ai.mjs 3199 &
          DATA_DIR="$RUNNER_TEMP/omnichat-data" PORT=3100 npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 1; done
          node scripts/e2e.cjs http://127.0.0.1:3100 http://127.0.0.1:3199 "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: omnichat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omnichat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
