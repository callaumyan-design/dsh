name: CI

on:
  push:
    branches: [main, desktop-pet]
    tags: ['soulpet-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release with this tag (e.g. soulpet-v0.2.0). Leave empty for a normal CI run.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Electron binary (Electron 45 no longer does this on install)
        run: npx install-electron
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test (real Electron + fake LLM server)
        run: |
          npm install -g playwright@1
          export NODE_PATH="$(npm root -g)"
          xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  e2e-windows:
    # Real Electron on a real Windows desktop: transparency, DPAPI key storage, win32 code paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - name: End-to-end smoke test on Windows
        shell: pwsh
        run: |
          npm install -g playwright@1
          $env:NODE_PATH = (npm root -g)
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: test-results/
          if-no-files-found: ignore

  package:
    needs: [test, e2e-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SoulPet-${{ runner.os }}
          path: |
            release/*/*.exe
            release/*/*.zip
            release/*/*.dmg
            release/*/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/soulpet-v') || startsWith(inputs.release, 'soulpet-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the installers: the e2e screenshot artifacts share file names across OSes,
      # and duplicate names make the release upload fail
      - uses: actions/download-artifact@v4
        with:
          pattern: SoulPet-*
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: SoulPet ${{ inputs.release || github.ref_name }}
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*
          draft: true
          body: |
            SoulPet 灵宠桌面宠物。Windows 下载 `.exe`（安装版）或 `.zip`（解压即用，在 SoulPet.exe 旁新建 SoulPetData 文件夹即为便携模式）。
            安装包未签名，SmartScreen 提示时选择“更多信息 → 仍要运行”。
