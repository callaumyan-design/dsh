name: 科技晨读（App）

# 构建新闻 App。仓库 Secrets 里有 CLOUDFLARE_API_TOKEN 时，推到 main 会发布到 https://news.callaum.com/（Cloudflare Worker `news`）；
# 没有时只测试构建。也可以在本地运行 news/app/deploy-cloudflare.mjs 发布。
on:
  push:
    branches: [main]
    paths:
      - 'news/app/**'
      - '.github/workflows/news-app.yml'
  pull_request:
    paths:
      - 'news/app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: news/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 发布到 Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::没有配置 CLOUDFLARE_API_TOKEN，这次只测试构建，不发布"
            exit 0
          fi
          node deploy-cloudflare.mjs
