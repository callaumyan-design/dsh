name: 科技晨读（服务器）

# 服务器代码改动时运行测试（含针对 Azurite 存储模拟器的测试），推到 main 时部署到 Azure 并生成一期。
# 部署用托管身份 dsh-news-deploy 通过 OIDC 登录 Azure，不需要保存任何密钥。
on:
  push:
    branches: [main]
    paths:
      - 'news/server/**'
      - '.github/workflows/news-server.yml'
  pull_request:
    paths:
      - 'news/server/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: 06dd2226-3553-45bd-ac80-e3718156c761
  AZURE_TENANT_ID: cde716e5-a8b0-48e3-bd3e-931a8e2b984f
  AZURE_SUBSCRIPTION_ID: ed4212a2-13ac-43a4-aa1f-d748cc68919f
  APP_NAME: dsh-news
  RESOURCE_GROUP: dsh-news

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: news/server/package-lock.json
      - run: npm ci
      - name: 启动 Azurite
        run: |
          npx --yes azurite@3 --silent --inMemoryPersistence --skipApiVersionCheck --loose &
          sleep 5
      - run: npm test
        env:
          AZURITE: '1'

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: news-server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: news/server/package-lock.json
      - name: 只装运行需要的依赖
        working-directory: news/server
        run: npm ci --omit=dev
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: news/server
          respect-funcignore: true
      - name: 检查接口并生成一期
        run: |
          base="https://${APP_NAME}.azurewebsites.net/api"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/v1/editions")
            [ "$code" = "200" ] && break
            echo "等待函数启动（HTTP $code）"; sleep 15
          done
          [ "$code" = "200" ] || { echo "::error::接口没有响应（HTTP $code）"; exit 1; }
          key=$(az functionapp keys list -g "$RESOURCE_GROUP" -n "$APP_NAME" --query functionKeys.default -o tsv)
          echo "::add-mask::$key"
          status=$(curl -s -o /tmp/run.json -w '%{http_code}' -X POST "$base/jobs/run-edition?code=$key")
          cat /tmp/run.json; echo
          [ "$status" = "202" ] || { echo "::error::触发生成失败（HTTP $status）"; exit 1; }
          echo "已开始生成，几分钟后打开 https://callaumyan-design.github.io/dsh/news/ 查看"
