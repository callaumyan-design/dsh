<!-- Claude：一团向外放射的光芒。白色图形，底是透明的：主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g stroke="#fff" stroke-width="10" stroke-linecap="round">
    <line x1="66.9" y1="61.0" x2="99.6" y2="65.6"/>
    <line x1="65.5" y1="64.3" x2="84.4" y2="79.1"/>
    <line x1="62.6" y1="66.5" x2="75.0" y2="97.1"/>
    <line x1="59.0" y1="66.9" x2="55.7" y2="90.7"/>
    <line x1="55.7" y1="65.5" x2="35.4" y2="91.5"/>
    <line x1="53.5" y1="62.6" x2="31.3" y2="71.6"/>
    <line x1="53.1" y1="59.0" x2="20.4" y2="54.4"/>
    <line x1="54.5" y1="55.7" x2="35.6" y2="40.9"/>
    <line x1="57.4" y1="53.5" x2="45.0" y2="22.9"/>
    <line x1="61.0" y1="53.1" x2="64.3" y2="29.3"/>
    <line x1="64.3" y1="54.5" x2="84.6" y2="28.5"/>
    <line x1="66.5" y1="57.4" x2="88.7" y2="48.4"/>
  </g>
  <circle cx="60" cy="60" r="10" fill="#fff"/>
</svg>
