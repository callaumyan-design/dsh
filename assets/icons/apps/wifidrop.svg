<!-- WiFi Drop：Wi-Fi 的两道弧，下面的圆点换成了一滴水。白色图形，底是透明的：主页上由网页垫一块毛玻璃。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <g filter="url(#sh)">
    <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
      <path d="M27.5 51.5 a46 46 0 0 1 65 0"/>
      <path d="M38.8 62.8 a30 30 0 0 1 42.4 0" opacity=".88"/>
    </g>
    <path d="M60 66 C66.5 74 72 80 72 86.5 a12 12 0 0 1 -24 0 C48 80 53.5 74 60 66 Z" fill="#fff"/>
  </g>
</svg>
