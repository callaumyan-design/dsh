<!-- Duo 适配：一台打开的折叠屏，右下角是“已适配”的对勾。白色图形，底是透明的：主页上由网页垫一块毛玻璃。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <mask id="cut"><rect width="120" height="120" fill="#fff"/><circle cx="86" cy="83" r="17.5" fill="#000"/></mask>
  <g filter="url(#sh)">
    <g mask="url(#cut)">
      <rect x="23" y="31" width="35" height="58" rx="8" fill="#fff"/>
      <rect x="62" y="31" width="35" height="58" rx="8" fill="#fff" opacity=".78"/>
    </g>
    <circle cx="86" cy="83" r="13.5" fill="#fff"/>
    <path d="M79.5 83.2l4.6 4.6 8.6-9.2" fill="none" stroke="rgba(15,23,42,.55)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
