<!-- Duo 适配：一台打开的折叠屏，右下角是“已适配”的对勾。白色图形，底是透明的：主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 右边那块屏在对勾周围留一圈空隙：用"整个画布减去一个圆"来裁切 -->
    <clipPath id="cut"><path clip-rule="evenodd" d="M0 0H120V120H0Z M68.5 83a17.5 17.5 0 1 0 35 0a17.5 17.5 0 1 0 -35 0Z"/></clipPath>
  </defs>
  <rect x="23" y="31" width="35" height="58" rx="8" fill="#fff"/>
  <rect x="62" y="31" width="35" height="58" rx="8" fill="#fff" fill-opacity=".78" clip-path="url(#cut)"/>
  <circle cx="86" cy="83" r="13.5" fill="#fff"/>
  <path d="M79.5 83.2l4.6 4.6 8.6-9.2" fill="none" stroke="#0f172a" stroke-opacity=".55" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
