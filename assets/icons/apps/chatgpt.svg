<!-- ChatGPT：六片首尾相扣的圆角花瓣（简化的花结）。白色线条，底是透明的：主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g fill="none" stroke="#fff" stroke-width="6.5" stroke-linejoin="round">
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(0 60 60)"/>
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(60 60 60)"/>
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(120 60 60)"/>
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(180 60 60)"/>
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(240 60 60)"/>
    <rect x="38" y="25" width="25" height="44" rx="12.5" transform="rotate(300 60 60)"/>
  </g>
</svg>
