    <path d="M36 38 L84 38"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-opacity=".85">
    <path d="M52 40 L52 80"/>
    <path d="M60 40 L60 80"/>
    <path d="M68 40 L68 80"/>
  </g>
  <rect x="44" y="80" width="32" height="12" rx="6" fill="#fff"/>
