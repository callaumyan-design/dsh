  <path d="M43 55 a17 17 0 0 1 34 0 z" fill="#fff"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity=".9">
    <path d="M60 31.5 v4"/><path d="M45.5 38 l2.6 2.6"/><path d="M74.5 38 l-2.6 2.6"/>
  </g>
  <rect x="38" y="55" width="44" height="5.5" rx="2.75" fill="#fff"/>
  <rect x="38" y="68" width="44" height="6" rx="3" fill="#fff" fill-opacity=".9"/>
  <rect x="38" y="80.5" width="28" height="6" rx="3" fill="#fff" fill-opacity=".9"/>
</svg>
