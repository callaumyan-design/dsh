<!-- 砚录：取景框里的几行字，中间一道扫描线。白色图形，底是透明的：主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 44 v-9 a8 8 0 0 1 8 -8 h9"/>
    <path d="M76 27 h9 a8 8 0 0 1 8 8 v9"/>
    <path d="M93 76 v9 a8 8 0 0 1 -8 8 h-9"/>
    <path d="M44 93 h-9 a8 8 0 0 1 -8 -8 v-9"/>
  </g>
  <rect x="42" y="42" width="36" height="6.5" rx="3.25" fill="#fff" fill-opacity=".9"/>
  <rect x="42" y="71.5" width="25" height="6.5" rx="3.25" fill="#fff" fill-opacity=".9"/>
  <rect x="19" y="56.5" width="82" height="7" rx="3.5" fill="#fff"/>
</svg>
