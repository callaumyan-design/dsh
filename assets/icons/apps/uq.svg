<!-- UQ 校历：一本日历，其中一天被圈了出来。白色图形，底是透明的：主页上由网页垫一块毛玻璃。
     不要给它加 filter（投影、模糊）或 mask：iPhone 的 Safari 会把带这些效果的 svg 图片按低分辨率画，图标会糊。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect x="25" y="30" width="70" height="63" rx="12" fill="#fff"/>
  <path d="M25 42 a12 12 0 0 1 12 -12 h46 a12 12 0 0 1 12 12 v8 h-70 z" fill="#0f172a" fill-opacity=".165"/>
  <g fill="#fff" stroke="#0f172a" stroke-opacity=".4" stroke-width="3">
    <rect x="40.5" y="21" width="8" height="17" rx="4"/>
    <rect x="71.5" y="21" width="8" height="17" rx="4"/>
  </g>
  <g fill="#0f172a" fill-opacity=".18">
    <circle cx="40" cy="62" r="3.6"/><circle cx="53.3" cy="62" r="3.6"/><circle cx="66.6" cy="62" r="3.6"/><circle cx="80" cy="62" r="3.6"/>
    <circle cx="40" cy="74.5" r="3.6"/><circle cx="53.3" cy="74.5" r="3.6"/><circle cx="80" cy="74.5" r="3.6"/>
  </g>
  <circle cx="66.6" cy="74.5" r="6.4" fill="#0f172a" fill-opacity=".55"/>
</svg>
