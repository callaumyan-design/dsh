# Cloudflare Workers deployment (free tier is enough for personal use).
# 1) npx wrangler d1 create omnichat      -> paste the database_id below
# 2) npx wrangler secret put APP_SECRET   -> any long random string (encrypts stored API keys)
# 3) npm run cf:deploy
name = "omnichat"
main = "server/worker.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "omnichat"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Set to "true" to let other people register after the admin account exists.
ALLOW_REGISTER = "false"
